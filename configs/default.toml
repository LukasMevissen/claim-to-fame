# Agent configuration. Every run records a hash of this file, so results are
# traceable to the exact settings. Copy to configs/<name>.toml for experiments
# and pass --config configs/<name>.toml.

[runtime]
deadline_seconds = 54         # hard budget inside the 60 s window, leaves margin for submit
llm_timeout_seconds = 38
fixed_max_seconds = 12        # fixed fallback prices are only submitted this early (see play_game)
# Second machine (C2F_ROLE=standby): its answer is sent no earlier than this many seconds after
# the game start, so it lands after the primary's stages (their backup stage arrived after
# 10-43 s in games 40-62) and stands. 0 = send as soon as it is ready.
standby_hold_seconds = 47
# With `run --no-sync`: still fetch the public transactions and rebuild the table and summary
# between games (about 10 s per game), skip only the opponent-belief refit. Without it a
# --no-sync runner prices every game with the reference cases of its last manual sync.
sync_without_refit = true

[llm]
# full stage: reasoning model that applies the policy wording (sub-limits, reductions,
# optional covers). Replay of games 1-8 against the real opponents: gpt-4.1-mini +1k,
# gpt-4.1 +21k, gpt-6.2-sol +27k..+42k (oracle 71k). 5-25 s per case.
model = "gpt-6.2-sol"
reasoning_effort = "low"
# fast stage: submitted first as a safety net in case the full stage is slow or fails
fast_model = "gpt-4.1"
fallback_model = "gpt-4.1"
# backup stage: the same assessment by another provider, in parallel. Submitted only if the
# full stage does not answer in time (dropped connection, outage, key out of credit).
# Replay games 1-19 and live shadows 15-20: claude-opus-5-5 is at least as good as the full model.
backup = "anthropic:claude-opus-5-5@medium"   # medium from game 31 (user request); 22-line case: 31 s vs 19 s at low
# true: the backup answer outranks the full stage (the full stage then only stands if the
# backup provider fails). Replay games 10-19: claude-opus-5-5@low 29.9k vs gpt-6.2-sol@low
# 13.4k / 16.7k (two runs); games 1-19: 62.5k vs gpt-6.2-sol@high 44.1k.
prefer_backup = true
temperature = 0.0
use_pricebook = true         # show earlier cases with their revealed t bounds (c2f/pricebook.py)
pricebook_max_chars = 24000
# Item prior as context (c2f/item_prior.py): append a PRICE PRIORS block for the recurring
# lines of the invoice (t per unit with an 80 % range, how often the line type was indemnified).
# A/B on games 20-46, gpt-6.2-sol@low, 3 runs per arm, prior fitted on earlier games only:
# replayed net 63.5k -> 90.9k, price error on lines with a prior row 0.27 -> 0.23
# (scripts/item_prior_ab.py, docs/research/item_prior.md). Not tested on claude-opus-5-5
# (no Anthropic credit on 2026-11-22): set to false if its shadow results get worse.
use_item_prior = true
# Analyst (c2f/analyst.py, docs/research/overhaul.md): which earlier cases the model is shown
# and how it is told to build a threshold.
#   "x3"   the newest earlier cases that fit into pricebook_max_chars (14 of 50+ by game 47)
#   "rel"  the same prompt, but the earlier cases most similar to the current one first
#   "x5"   rel + a prompt that states t = unit rate x invoiced quantity x policy arithmetic
# Walk-forward games 30-55 on the live model (claude-opus-5-5@medium, 2 runs per arm, every
# game assessed with earlier games only, replayed against the real opponents):
#   x3 70.0k   rel 130.1k (+60.1k, 90 % interval +21k to +109k, better in 15 games, worse in 5)
#   x5 109.4k (+39.3k). Both runs of rel (124k, 136k) lie above both runs of x3 (64k, 76k).
# gpt-6.2-sol@low, 3 runs: x3 115.3k, rel 120.5k, x5 117.8k (inside its run-to-run spread).
# The gain comes from the price level of large new items: with similar cases in view the
# model stops overpricing them (game 38 air conditioner 1,900 -> 1,600 for t 1,352-1,445).
analyst = "rel"

[shadow]
# Models that assess every case in parallel to the live workflow. Never submitted; scored
# afterwards by `python -m c2f shadow-report`. Format "provider:model@effort".
# Anthropic models need ANTHROPIC_API_KEY in .env.
# claude-opus-5-5@low is the live answer now ([llm].backup + prefer_backup) and sonnet replayed
# far below the others (games 10-19: 1.4k vs 28-30k), so only fable stays as a comparison.
models = []   # shadow tests stopped 2026-11-21 20:15 UTC (cost); e.g. ["anthropic:claude-fable-5-2@low"]
timeout_seconds = 120

[api]
# From vendor/quantco/API_HANDBOOK.md. Auth: X-API-Key header (TEAM_API_KEY).
# Game 0 is the permanent test game (key always available, case_000.zip).
base_url = "https://c2f.public.quantco.cloud"
games_endpoint = "/api/games/list"
key_endpoint = "/api/games/{game_id}/key"            # 403 until start_time
submit_endpoint = "/api/games/{game_id}/submissions"  # PUT, last write wins
cases_dir = "data/cases"                              # case_{game_id:03d}.zip
key_poll_seconds = 30       # keep polling the key this long after start_time (1 req/s; 403, 429 and 5xx are retried)

[fallback]
# (a, b) for invoice lines the model did not price: the model failed, timed out or skipped
# a line. The API default of 0 / 0 earns nothing and rejects every charge (1.5a per fair one).
# Replay games 1-19 with these as the only prices (cap c = 4t): 20/20 -> -73k, 100/0 -> -48k,
# 200/0 -> -22k, 300/0 -> -6k, 400/0 -> +2k, 800/0 -> -12k. A high charge is paid 1.5x on the
# big lines where it is fair and by lenient teams elsewhere; the limit stays 0 without a price.
# Game 21 (no model answer in time, 20/20 submitted on 22 lines) cost -15.8k.
charge_price = 350.0
acceptance_limit = 0.0

[pricing]
acceptance_quantile = 0.3333333333
acceptance_shrink = 1.05     # games 26-46 replay: +8.5k, 14 games better, 0 worse (1.10: losing games); live from game 48
# Adaptive: after every game c2f/limit_factor.py re-measures the factor on the recent games of
# the current model and writes it here; used clamped to [1, cap]. Walk-forward games 26-47 with
# cap 1.06: it chose 1.04-1.06 throughout; caps of 1.10+ had losing games. Delete the file or
# the two keys to fall back to the fixed factor above.
acceptance_shrink_from = "results/market/limit_factor.json"
acceptance_shrink_cap = 1.06
charge_floor_quantile = 0.05
charge_ceiling_quantile = 0.95
# Floor for a as a share of our median estimate. 12-game replay: 0 -> 40.5k, 0.87 -> 47.0k,
# 0.90 -> 48.0k, 0.93 -> 40.3k (cliff: charges start to exceed t), so 0.87 keeps a margin.
charge_min_ratio = 0.87
# Confident estimates (belief sigma below charge_conf_sigma) are charged at least this share.
charge_conf_sigma = 0.12
charge_conf_ratio = 0.95
n_t_grid = 100
n_candidates = 60
n_opp_draws = 15
# Learned opponent population (scripts/update_opponents.py, refreshed after every game).
# When this file exists it replaces the hand-set mix below; delete it to fall back.
opponents_from = "results/opponent_belief.json"
team_name = "GemischtesHack"
min_limit_obs = 3.0      # teams with less evidence on b keep the default noisy rule

# Opponent population used to choose the charge price a.
# Calibrate from the leaderboard "Matchup" and "Transactions" tabs once games ran.
[[pricing.opponents]]
weight = 0.15
kind = "absent"          # never submits: b = 0, rejects everything

[[pricing.opponents]]
weight = 0.05
kind = "accept_all"

[[pricing.opponents]]
weight = 0.80
kind = "noisy"           # b = t * exp(mu + s Z)
mu = 0.0
s = 0.35
miss_zero = 0.5

[charge_agent]
# Charge agent (c2f/charge_agent.py): decides the charge a per line from all earlier rounds
# instead of the fixed share of the estimate above (charge_min_ratio, tuned on games 1-12).
# The limit b is not touched. Walk-forward backtest on games 13-47 against the fixed rule
# incl. the confident-line floor (scripts/charge_agent_backtest.py, docs/research/charge_agent.md):
#   rule / neutral +23k (90% interval -6k to +53k)    rule / loving +15k (-35k to +63k)
#   llm  / neutral +18k (gpt-4.1) to +29k (gpt-6.2-sol@low)    llm / loving +5k to +7k
# "off" | "rule" (no model call, milliseconds) | "llm" (a judge model weighs the earlier rounds,
# in parallel to the assessment; rule weights when it is late or fails).
mode = "off"                 # off since 2026-11-22 07:30 (user request): no shadow charges, fixed rule only
risk = "neutral"             # "neutral" (maximise expected revenue) | "loving" (revenue ** gamma_loving)
# Shadow run: the agent prices every game, but only the fixed rule's charges are submitted; the
# agent's are recorded (runs/submissions.jsonl, timing.charge_agent.shadow_charges). After each
# round is public both are scored against the real opponents (results/charge_agent/shadow.json).
# Once the agent earned more in takeover_rounds scored rounds in a row, its charges are submitted
# from the next game on (not taken back automatically). shadow = false: submit the agent's
# charges at once. takeover = false: stay in shadow whatever the score.
shadow = true
# false since 2026-11-22: replay of games 56-63 through the live workflow, agent 291.7k vs fixed
# rule 308.1k (-16.3k, 3 of 8 rounds won). Stays in shadow until the live record says otherwise.
takeover = false
takeover_rounds = 3
gamma_loving = 2.0
judge_model = "gpt-4.1"      # or "gpt-6.2-sol@low"; backtest: median 3.4 s / 4.8 s, max 9.8 s / 12.7 s
judge_timeout_seconds = 15   # the judge call is cut off after this
judge_wait_seconds = 20      # the full stage waits for the judge at most until this long after its start

[belief]
# Floors applied to the LLM's stated uncertainty.
min_sigma = 0.2
confident_below = 0.12       # stated log-sd below this is trusted ...
confident_min_sigma = 0.10   # ... down to this value (limit b = about 0.96 x estimate)
max_sigma = 1.2
# Item prior at belief level (c2f/item_prior.py::combine), applied after the assessment to lines
# the model believes indemnified and whose estimate is within e^1 of the prior:
# "off" | "fuse" (precision-weighted with the model's estimate) | "replace" (the prior's level).
# Same A/B: 63.5k -> 67.3k (fuse) / 73.3k (replace); stored live answers of games 5-46:
# 80.7k -> 89.2k / 91.2k. Less than the prompt block ([llm] use_item_prior), and the same
# evidence would count twice with both on, so this stays off while the block is on.
item_prior = "off"
# Case memory (c2f/memory.py): a line with a precedent of a class that named the later
# threshold often enough on all earlier games takes the precedent's amount and its narrow
# spread. "off" | "case" | "case+wording". See docs/research/overhaul.md for the backtest.
memory = "off"
